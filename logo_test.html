<!DOCTYPE html>
<html>
<head>
    <title>NIMS - Logo Test</title>
    <style>
        .logo {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 20px;
        }
        .logo1 {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-right: 1px solid #ccc;
            padding-right: 20px;
            margin-right: 20px;
        }
        .logo1 img {
            max-width: 60px;
        }
        .logo2 img {
            max-width: 60px;
        }
        .tbcn-label {
            margin-left: -10px;
            color: #177D3E;
            font-style: italic;
            font-size: small;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        .title {
            text-align: center;
            margin: 20px;
            font-size: 24px;
            color: #333;
        }
    </style>
</head>
<body>
    <h1>National Infrastructure Monitoring System</h1>
    
    <div class="title">Updated Logo Layout</div>
    
    <div class="logo row">
        <div class="column logo1 mb-4">
            <img class="border-end-1" src="static/tbcn-logo2.png" alt="TBCN Logo">
            <label class="tbcn-label" for="logo1">TBCN</label>
        </div>
        <div class="mb-4 column">
            <img class="logo2" src="static/img/nigeria_coat_of_arms.png" alt="Nigeria Coat of Arms">
        </div>
    </div>

    <div style="text-align: center; margin-top: 40px;">
        <h3>Project Registration Form</h3>
        <p>Sample fields:</p>
        <ul style="list-style: none; padding: 0;">
            <li>✓ Name</li>
            <li>✓ Address</li>
            <li>✗ Phone Number (REMOVED)</li>
            <li>✓ Project ID (was Product ID)</li>
            <li>✓ State</li>
        </ul>
    </div>
</body>
</html>
